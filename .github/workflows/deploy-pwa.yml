name: Build Holoo Dark PWA

on:
  push:
    branches:
      - feature/three-device-local-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build PWA
        run: npm run build
      - name: Upload PWA build
        uses: actions/upload-artifact@v4
        with:
          name: holoo-dark-pwa-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
