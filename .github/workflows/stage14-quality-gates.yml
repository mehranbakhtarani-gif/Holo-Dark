name: Stage 14 Quality Gates

on:
  push:
    branches:
      - fix/accounting-fifo-persistence
  pull_request:
    branches:
      - fix/accounting-fifo-persistence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage14-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run project test suite
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
