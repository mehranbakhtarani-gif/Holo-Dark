name: Release validation

on:
  push:
    branches:
      - fix/accounting-fifo-persistence
  pull_request:
    branches:
      - fix/accounting-fifo-persistence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, TypeScript and production PWA build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-progress

      - name: Run test suite
        run: npm test

      - name: TypeScript validation
        run: npm run lint

      - name: Firestore rules security lint
        run: npm run lint:rules

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules emulator tests
        run: npm run test:rules

      - name: Install Firebase Functions dependencies
        run: npm install --no-audit --no-fund --no-progress
        working-directory: functions

      - name: Type-check Firebase Functions
        run: npm run lint
        working-directory: functions

      - name: Build production application
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
