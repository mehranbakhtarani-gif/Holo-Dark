name: Release validation

on:
  push:
    branches:
      - fix/accounting-fifo-persistence
  pull_request:
    branches:
      - fix/accounting-fifo-persistence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, TypeScript and production PWA build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-progress

      - name: Run test suite
        run: npm test

      - name: TypeScript validation
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
