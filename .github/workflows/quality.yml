name: Holo-Dark Quality Gate

on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run regression suite
        run: bun run test

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build
